[workspace]
resolver = "3"
members = ["crates/core", "crates/cli", "apps/desktop/src-tauri"]

[workspace.package]
version = "0.5.0"
edition = "2024"
license = "Apache-2.0"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
# unwind, so a panic in a file parser is caught (catch_unwind) instead of ending the app
panic = "unwind"
strip = true
