[package]
name = "jobpilot-cli"
description = "JobPilot AI command line"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "jobpilot"
path = "src/main.rs"

[dependencies]
jobpilot-core = { path = "../core" }
clap = { version = "4", features = ["derive"] }
serde = "1"
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt", "signal"] }

[dev-dependencies]
tempfile = "3"
