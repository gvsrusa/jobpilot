[package]
name = "jobpilot-cli"
description = "JobPilot AI command line"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "jobpilot"
path = "src/main.rs"

[dependencies]
jobpilot-core = { path = "../core" }
clap = { version = "4", features = ["derive"] }
rpassword = "=7.5.4"
serde = "1"
serde_json = "1"
shlex = "=1.3.0"
tokio = { version = "1", features = ["macros", "rt", "signal", "io-std", "io-util", "process", "time"] }

[dev-dependencies]
keyring = "4"
keyring-core = "1"
tempfile = "3"
sqlx = { version = "0.9", default-features = false, features = ["sqlite"] }
