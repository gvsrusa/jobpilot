<!doctype html>
<!-- A synthetic fixture for the apply browser tests: invented names, no brand asset. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Data Engineer - Tallowbrook</title>
</head>
<body>
<main>
<h1>Data Engineer at Tallowbrook</h1>
<form action="/form" method="post" enctype="multipart/form-data">
<div><span>Full name</span><input aria-label="Full name" name="name" type="text" autocomplete="off"></div>
<div><span>Email</span><input aria-label="Email" name="email" type="email" autocomplete="off"></div>
<div><span>Why this role?</span><textarea aria-label="Why this role?" name="why" rows="3"></textarea></div>
<div><span>Resume</span><input aria-label="Resume" name="resume" type="file"></div>
<div><span>Cover letter</span><input aria-label="Cover letter" name="letter" type="file"></div>
<div><button type="submit">Submit application</button></div>
</form>
</main>
</body>
</html>
