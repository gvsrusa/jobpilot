<!doctype html>
<!-- A synthetic fixture for the apply browser tests: invented names, no brand asset. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Platform Engineer - Quillfeather Systems</title>
</head>
<body>
<header><p>Quillfeather Systems job board</p></header>
<main>
<section id="landing">
<h1>Platform Engineer</h1>
<p>Quillfeather Systems. Remote, full time.</p>
<p>You will build the services our small teams depend on.</p>
<a href="#application" id="apply">Apply now</a>
</section>
<section id="application" hidden>
<h2>Apply for Platform Engineer</h2>
<form action="/form" method="post" enctype="multipart/form-data">
<p><label for="first">First name *</label><br><input id="first" name="first_name" type="text" autocomplete="off"></p>
<p><label for="last">Last name *</label><br><input id="last" name="last_name" type="text" autocomplete="off"></p>
<p><label for="email">Email *</label><br><input id="email" name="email" type="email" autocomplete="off"></p>
<p><label for="why">Why this role?</label><br><textarea id="why" name="why" rows="3"></textarea></p>
<div role="group" aria-labelledby="resume-label">
<p id="resume-label">Resume/CV *</p>
<button type="button" data-for="resume">Attach</button>
<input id="resume" name="resume" type="file" hidden>
</div>
<div role="group" aria-labelledby="letter-label">
<p id="letter-label">Cover letter</p>
<button type="button" data-for="letter">Attach</button>
<input id="letter" name="letter" type="file" hidden>
</div>
<p><button type="submit">Submit application</button></p>
</form>
</section>
</main>
<script>
// Each Attach button opens the hidden file input it stands for.
for (const button of document.querySelectorAll("button[data-for]")) {
  button.addEventListener("click", () => document.getElementById(button.dataset.for).click());
}
// A link to the form on the same page, as a job board's landing page has.
document.getElementById("apply").addEventListener("click", () => {
  document.getElementById("landing").hidden = true;
  document.getElementById("application").hidden = false;
});
</script>
</body>
</html>
