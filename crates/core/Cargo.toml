[package]
name = "jobpilot-core"
description = "JobPilot AI core library"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
aes-gcm = "=0.11.1"
dirs = "7"
keyring = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite", "sqlite-bundled", "macros", "migrate"] }
thiserror = "2"
unicode-normalization = "=0.1.26"
docx-rs = "=0.4.22"
printpdf = { version = "=0.12.8", default-features = false }
tokio = { version = "1", features = ["macros", "rt", "sync", "time", "process", "io-util"] }
jsonschema = { version = "=0.60.2", default-features = false } # no resolve-http: nothing but Ollama opens a socket
pdf-extract = "=0.12.1"
zip = { version = "=8.6.0", default-features = false, features = ["deflate"] }
zeroize = "1"
reqwest = { version = "=0.13.5", default-features = false, features = ["json", "stream", "native-tls-no-alpn"] }
sysinfo = { version = "=0.40.1", default-features = false, features = ["system", "disk"] }
tempfile = "3"
quick-xml = "=0.42.0"
regex = "=1.13.1"
time = { version = "=0.3.55", default-features = false, features = ["std", "parsing", "formatting"] }

[dev-dependencies]
keyring-core = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }

