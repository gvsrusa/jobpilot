name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Licenses, advisories, bans and sources for the Rust tree (deny.toml), and high-severity
  # advisories in the production JavaScript tree.
  supply-chain:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod --audit-level high

  check:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    env:
      JOBPILOT_SECRET_SERVICE: jobpilot-ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: dtolnay/rust-toolchain@d124f86f28ff42855784ff3319f48ac182c248f8 # 1.99.1
        with:
          components: rustfmt, clippy

      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      # externalBin: the desktop crate's build script wants the CLI sidecar in place.
      - run: pnpm --filter desktop sidecar
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --no-fail-fast

      # Apply mode against the real pinned Playwright server and a visible Chromium, on the
      # local fixture forms served on 127.0.0.1. The runtime goes under a temporary root.
      # No browser cache: a cache restored into the temporary root before `browser setup`
      # makes the root non-empty and not yet JobPilot's, so setup refuses it
      # (`root_not_owned`). Chromium is downloaded each run.
      - name: Browser end to end
        timeout-minutes: 15
        shell: bash
        env:
          JOBPILOT_SECRET_SERVICE: jobpilot-test
        run: |
          home="$RUNNER_TEMP/jobpilot-e2e"
          mkdir -p "$home"
          cargo build -p jobpilot-cli
          JOBPILOT_HOME="$home" ./target/debug/jobpilot browser setup
          JOBPILOT_E2E_RUNTIME="$home/browser-runtime" cargo test -p jobpilot-core --test apply_browser -- --ignored --test-threads=1 --skip serve_fixtures

      # The real `claude` and `gemini` smokes are never run in CI (they spend the owner's
      # subscription), real_tls_handshake has its own step below, and make_fixtures would
      # rewrite committed fixtures, so all are skipped by name.
      # A locked keychain waits for an unlock dialog on a headless Mac and never returns.
      - name: Keychain tests (macOS)
        if: runner.os == 'macOS'
        timeout-minutes: 10
        run: |
          security create-keychain -p ci ci.keychain
          security default-keychain -s ci.keychain
          security unlock-keychain -p ci ci.keychain
          security set-keychain-settings ci.keychain
          cargo test --workspace -- --ignored --skip real_claude --skip real_gemini --skip real_tls --skip make_fixtures --skip browser_e2e --skip serve_fixtures

      # The tests' own `keyring::Entry` calls bypass the product's one-at-a-time rule, and
      # Credential Manager answers overlapping calls wrongly, so one test runs at a time.
      - name: Keychain tests (Windows)
        if: runner.os == 'Windows'
        timeout-minutes: 10
        run: cargo test --workspace -- --ignored --skip real_claude --skip real_gemini --skip real_tls --skip make_fixtures --skip browser_e2e --skip serve_fixtures --test-threads=1

      # Four keyless connections, one to each vendor host, any HTTP status counts. On Windows
      # this is the Schannel proof.
      - name: TLS handshake
        run: cargo test -p jobpilot-core --test net -- --ignored real_tls_handshake
        env:
          JOBPILOT_REAL_TLS: 1

      - run: pnpm tauri build --no-bundle
