name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      JOBPILOT_SECRET_SERVICE: jobpilot-ci
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: rustfmt, clippy

      - uses: swatinem/rust-cache@v2

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      # externalBin: the desktop crate's build script wants the CLI sidecar in place.
      - run: pnpm --filter desktop sidecar
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --no-fail-fast

      # The real `claude` and `gemini` smokes are never run in CI (they spend the owner's
      # subscription), real_tls_handshake has its own step below, and make_fixtures would
      # rewrite committed fixtures, so all are skipped by name.
      # A locked keychain waits for an unlock dialog on a headless Mac and never returns.
      - name: Keychain tests (macOS)
        if: runner.os == 'macOS'
        timeout-minutes: 10
        run: |
          security create-keychain -p ci ci.keychain
          security default-keychain -s ci.keychain
          security unlock-keychain -p ci ci.keychain
          security set-keychain-settings ci.keychain
          cargo test --workspace -- --ignored --skip real_claude --skip real_gemini --skip real_tls --skip make_fixtures

      - name: Keychain tests (Windows)
        if: runner.os == 'Windows'
        timeout-minutes: 10
        run: cargo test --workspace -- --ignored --skip real_claude --skip real_gemini --skip real_tls --skip make_fixtures

      # Four keyless connections, one to each vendor host, any HTTP status counts. On Windows
      # this is the Schannel proof.
      - name: TLS handshake
        run: cargo test -p jobpilot-core --test net -- --ignored real_tls_handshake
        env:
          JOBPILOT_REAL_TLS: 1

      - run: pnpm tauri build --no-bundle
