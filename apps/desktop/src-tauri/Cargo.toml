[package]
name = "jobpilot-desktop"
description = "JobPilot AI desktop shell"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "jobpilot_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-clipboard-manager = "=2.5.0"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "=2.7.2"
tauri-plugin-single-instance = "2"
jobpilot-core = { path = "../../../crates/core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "=0.9.0"
tokio = { version = "1", features = ["sync", "time"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Already in the tree through the clipboard plugin, whose API cannot keep a copy out of
# clipboard history. The same version and features.
[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
arboard = { version = "=3.7.0", features = ["wayland-data-control"] }

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
sqlx = { version = "0.9", default-features = false, features = ["sqlite"] }
tempfile = "3"
